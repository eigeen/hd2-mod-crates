name: Release Desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      HD2_UPDATE_PUBLIC_KEY_HEX: ${{ vars.ZIPSIGN_PUBLIC_KEY_HEX }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Stable desktop release tags must use v<major>.<minor>.<patch>: $tag"
          }
          $version = $Matches[1]
          $manifest = Get-Content -LiteralPath 'Cargo.toml' -Raw -Encoding UTF8
          $manifestMatch = [regex]::Match($manifest, '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $manifestMatch.Success -or $manifestMatch.Groups[1].Value -ne $version) {
            throw "Tag $tag does not match workspace version $($manifestMatch.Groups[1].Value)"
          }
          if ($env:HD2_UPDATE_PUBLIC_KEY_HEX -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'Repository variable ZIPSIGN_PUBLIC_KEY_HEX must contain the fixed 32-byte public key as hex'
          }
          $hostTarget = (rustc -vV | Select-String '^host: (.+)$').Matches.Groups[1].Value
          if ($hostTarget -ne '${{ matrix.target }}') {
            throw "Runner host $hostTarget does not match expected target ${{ matrix.target }}"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Test Rust desktop backend
        run: cargo test -p hd2_migrator_desktop

      - name: Lint Rust desktop backend
        run: cargo clippy -p hd2_migrator_desktop --all-targets --no-deps -- -D warnings

      - name: Build release executable
        run: bun run desktop:build

      - name: Verify release executable metadata
        run: bun run desktop:info

      - name: Create unsigned release archive
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $archiveName = "hd2-mod-tools-desktop-${{ matrix.target }}-v$env:RELEASE_VERSION.zip"
          $archivePath = Join-Path $releaseDirectory $archiveName
          $executablePath = Join-Path $PWD 'target/release/hd2_migrator_desktop.exe'
          Compress-Archive -LiteralPath $executablePath -DestinationPath $archivePath -CompressionLevel Optimal
          $publicKeyPath = Join-Path $releaseDirectory 'public-key-${{ matrix.target }}.hex'
          $env:HD2_UPDATE_PUBLIC_KEY_HEX.ToLowerInvariant() | Set-Content -LiteralPath $publicKeyPath -Encoding utf8 -NoNewline

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($archive.Entries)
            if ($entries.Count -ne 1 -or $entries[0].FullName -ne 'hd2_migrator_desktop.exe') {
              throw 'Release ZIP must contain only hd2_migrator_desktop.exe'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload unsigned archive for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-desktop-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.hex
          if-no-files-found: error

  build-release-tools:
    name: Build isolated release tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release-tools

      - name: Build client-compatible verifier
        run: cargo build --locked --release -p update-archive-verifier

      - name: Build archive signer
        run: cargo install zipsign --version 0.2.1 --locked --root release-tools

      - name: Upload isolated release tools
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-tools
          path: |
            target/release/update-archive-verifier
            release-tools/bin/zipsign
          if-no-files-found: error

  sign-and-draft-release:
    name: Sign archives and create draft release
    needs: [build, build-release-tools]
    runs-on: ubuntu-latest
    environment: desktop-signing
    permissions:
      contents: write
    steps:
      - name: Download unsigned archives
        uses: actions/download-artifact@v8
        with:
          pattern: unsigned-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Download isolated release tools
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-tools
          path: release-tools

      - name: Prevent mutation of a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          lookup_error="$RUNNER_TEMP/release-lookup-error.txt"
          if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>"$lookup_error")"; then
            if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
              echo "Refusing to overwrite the published release $RELEASE_TAG" >&2
              exit 1
            fi
          elif ! grep -q '(HTTP 404)' "$lookup_error"; then
            cat "$lookup_error" >&2
            exit 1
          fi
          rm -f -- "$lookup_error"

      - name: Sign archives with protected private key
        shell: bash
        env:
          ZIPSIGN_PRIVATE_KEY_BASE64: ${{ secrets.ZIPSIGN_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/desktop-update-private.key"
          public_key="$RUNNER_TEMP/desktop-update-public.key"
          trap 'rm -f -- "$private_key" "$public_key"' EXIT
          if [[ -z "$ZIPSIGN_PRIVATE_KEY_BASE64" ]]; then
            echo 'Environment secret ZIPSIGN_PRIVATE_KEY_BASE64 is required' >&2
            exit 1
          fi
          shopt -s nullglob
          key_markers=(release-assets/public-key-*.hex)
          if [[ ${#key_markers[@]} -ne 2 ]]; then
            echo "Expected two embedded public-key markers, found ${#key_markers[@]}" >&2
            exit 1
          fi
          expected_public_key="$(tr -d '\r\n' < "${key_markers[0]}")"
          if [[ ! "$expected_public_key" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo 'Embedded public-key marker is invalid' >&2
            exit 1
          fi
          for marker in "${key_markers[@]:1}"; do
            marker_key="$(tr -d '\r\n' < "$marker")"
            if [[ "${marker_key,,}" != "${expected_public_key,,}" ]]; then
              echo 'Architecture builds contain different update public keys' >&2
              exit 1
            fi
          done
          python3 - "$private_key" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["ZIPSIGN_PRIVATE_KEY_BASE64"].strip(), validate=True)
          )
          PY
          chmod +x release-tools/zipsign
          release-tools/zipsign gen-key --extract --force "$private_key" "$public_key"
          actual_public_key="$(python3 - "$public_key" <<'PY'
          import pathlib
          import sys

          print(pathlib.Path(sys.argv[1]).read_bytes().hex())
          PY
          )"
          if [[ "$actual_public_key" != "${expected_public_key,,}" ]]; then
            echo 'Signing secret does not match the public key embedded by the build jobs' >&2
            exit 1
          fi
          archives=(release-assets/*.zip)
          if [[ ${#archives[@]} -ne 2 ]]; then
            echo "Expected exactly two desktop archives, found ${#archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            release-tools/zipsign sign zip "$archive" "$private_key"
            release-tools/zipsign verify zip "$archive" "$public_key"
          done

      - name: Verify signatures with the client-compatible verifier
        shell: bash
        run: |
          set -euo pipefail
          chmod +x release-tools/update-archive-verifier
          public_key_hex="$(tr -d '\r\n' < "$(find release-assets -maxdepth 1 -name 'public-key-*.hex' -print -quit)")"
          for archive in release-assets/*.zip; do
            release-tools/update-archive-verifier "$archive" "$public_key_hex"
          done
          python3 - <<'PY'
          import pathlib
          import zipfile

          archives = sorted(pathlib.Path("release-assets").glob("*.zip"))
          for archive_path in archives:
              with zipfile.ZipFile(archive_path) as archive:
                  if archive.namelist() != ["hd2_migrator_desktop.exe"]:
                      raise RuntimeError(f"invalid release ZIP contents: {archive_path}")
          PY

      - name: Upload signed release archives
        uses: actions/upload-artifact@v7
        with:
          name: signed-desktop-release
          path: release-assets/*.zip
          if-no-files-found: error

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
