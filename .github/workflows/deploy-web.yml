name: Deploy Web UI to Netlify

on:
  push:
    branches: [main]
    paths:
      - "crates/web_ui/**"
      - "crates/hd2-migrator-wasm/**"
      - "crates/hd2-migrator-io/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "crates/web_ui/**"
      - "crates/hd2-migrator-wasm/**"
      - "crates/hd2-migrator-io/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: web-ui-wasm

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        working-directory: crates/web_ui
        run: bun install --frozen-lockfile

      - name: Build web UI
        working-directory: crates/web_ui
        run: bun run build

      - name: Deploy to Netlify (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=crates/web_ui/dist --prod --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify (preview)
        if: github.event_name == 'pull_request'
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=crates/web_ui/dist --alias="pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }} (${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
